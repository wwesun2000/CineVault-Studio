name: CI & Cross-Platform Release Build (Windows + Android)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag name to publish a GitHub Release (e.g. v1.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unittest suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

  build-windows:
    name: Build Windows Portable Release
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run unittest suite on Windows
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build CineVaultStudio.exe via PyInstaller
        shell: cmd
        run: scripts\build_windows_exe.bat

      - name: Assemble portable folder and run --self-check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\CineVaultStudio_Portable" | Out-Null
          Copy-Item -Path "dist\CineVaultStudio.exe" -Destination "dist\CineVaultStudio_Portable\CineVaultStudio.exe" -Force
          Copy-Item -Path "AI_ENRICHMENT_GUIDE.md" -Destination "dist\CineVaultStudio_Portable\AI_ENRICHMENT_GUIDE.md" -Force
          Copy-Item -Path "LICENSE" -Destination "dist\CineVaultStudio_Portable\LICENSE" -Force
          $p = Start-Process -FilePath "dist\CineVaultStudio_Portable\CineVaultStudio.exe" -ArgumentList "--self-check" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "CineVaultStudio.exe --self-check failed with exit code $($p.ExitCode)"
          }
          Remove-Item -Path "dist\CineVaultStudio_Portable\*.db","dist\CineVaultStudio_Portable\AI_KEYWORD_DB.md" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist\CineVaultStudio_Portable\*" -DestinationPath "dist\CineVaultStudio_Portable.zip" -Force

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CineVaultStudio-Windows-Portable
          path: |
            dist/CineVaultStudio.exe
            dist/CineVaultStudio_Portable.zip

  build-android:
    name: Build Android Universal APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Embed latest Web UI into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp src/ui/index.html android/app/src/main/assets/index.html

      - name: Build Universal Release APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Stage APK artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/CineVaultStudio-Android-Universal.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineVaultStudio-Android-Universal
          path: dist/CineVaultStudio-Android-Universal.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: CineVaultStudio-Windows-Portable
          path: release_assets

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: CineVaultStudio-Android-Universal
          path: release_assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          name: CineVault Studio ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          generate_release_notes: true
          body: |
            ## CineVault Studio (影库枢机) — Windows 便携版 & 安卓通用版

            ### 下载与安装说明
            - **Windows 绿色便携版**：下载 `CineVaultStudio_Portable.zip` 解压后双击 `CineVaultStudio.exe` 即可运行（或直接下载单文件 `CineVaultStudio.exe`）。
            - **Android 通用版 (APK)**：下载 `CineVaultStudio-Android-Universal.apk` 在安卓 7.0+ 手机或平板上安装即可使用（兼容 `arm64-v8a` / `armeabi-v7a` / `x86_64`）。

            ### 安卓端数据导入与使用说明
            1. 在电脑端点击「📦 同步包 (.cvpack)」导出 `cinevault_sync.cvpack`（推荐，内含全部本地封面图），或直接拷贝电脑端的 `cinevault_library.db`。
            2. 在安卓端点击底部栏 **「📥 导入」**，选择手机里的 `.cvpack` 或 `.db` 文件，即可导入全部片名、厂牌、女优、标签、半星评分与封面。
            3. 点击底部栏 **「📂 扫描」** 选择手机/SD 卡视频目录，安卓端会使用与电脑端完全一致的 `cvh1_blake2b_3x64k` 极速三段哈希自动对齐本地视频路径，点击即可直接唤起 **VLC for Android** 或内置播放器播放！
          files: |
            release_assets/CineVaultStudio_Portable.zip
            release_assets/CineVaultStudio.exe
            release_assets/CineVaultStudio-Android-Universal.apk
